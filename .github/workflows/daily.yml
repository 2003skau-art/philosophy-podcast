name: Daily 6 PM Philosophy Podcast
on:
  schedule:
    - cron: "30 12 * * *" # 12:30 UTC = 6:00 PM IST
  workflow_dispatch:      # Allows 1-click manual test run from GitHub

permissions:
  contents: write

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install openai edge-tts mutagen pyyaml google-genai tenacity
      - name: Generate Episode & Update RSS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: "gemini-3.1-flash-lite"
          PODCAST_BASE_URL: "https://2003skau-art.github.io/philosophy-podcast"
        run: python run_daily.py
      - name: Commit and Push New Episode
        run: |
          git config user.name "Podcast Agent"
          git config user.email "actions@github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Daily philosophy episode generated by AI agent"
          git push
