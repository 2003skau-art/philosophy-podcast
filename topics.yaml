- id: gita-4-38
  title: "Nothing purifies like knowing"
  type: gita
  ref: {chapter: 4, verse: 38}
  angle: "The difference between information and real understanding."

- id: gita-9-22
  title: "I carry what you lack"
  type: gita
  ref: {chapter: 9, verse: 22}
  angle: "Trust, and what it feels like to be looked after while still working."

- id: gita-18-66
  title: "Let go of everything and come"
  type: gita
  ref: {chapter: 18, verse: 66}
  angle: "The final instruction; what it means to put the burden down."
